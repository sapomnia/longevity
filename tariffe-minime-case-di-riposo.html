const it = d3.formatLocale({decimal: ',', thousands: '.', grouping: [3], currency: ['€', '']});
const nDec = it.format(',.2f'), nTick = it.format(',');

const sel = d3.select('#sel');
const regioniMenu = DATA.regioni.map(d => d.nome).sort((a, b) => a.localeCompare(b, 'it'));
sel.selectAll('option').data(['Tutte le regioni', ...regioniMenu]).join('option')
  .attr('value', d => d).text(d => d);

const wrapEl = document.getElementById('wrap');
const chartEl = document.getElementById('chart');
const tip = d3.select('#tip');
const svg = d3.select('#chart').append('svg').attr('class', 'main');
const gBg = svg.append('g');  // sfondo alternato delle righe, sotto a tutto
const gGrid = svg.append('g').attr('class', 'axis');
const gRows = svg.append('g');
const gLabels = svg.append('g');

function rows() {
  const v = sel.property('value');
  const base = v === 'Tutte le regioni'
    ? DATA.regioni.map(d => ({...d, tipo: 'regione'}))
    : DATA.aziende.filter(d => d.regione === v).map(d => ({...d, tipo: 'azienda'}));
  // ordinate per il valore più alto mostrato (per le tariffe delle singole strutture, la struttura più cara);
  // chi non paga nulla in fondo
  return base.sort((a, b) => (b.max ?? -1) - (a.max ?? -1) || (b.min ?? -1) - (a.min ?? -1) || a.nome.localeCompare(b.nome, 'it'));
}

function wrapLabel(text, width) {
  text.each(function () {
    const t = d3.select(this), words = t.text().split(/\s+/);
    t.text(null);
    let line = [], lines = [];
    const probe = t.append('tspan');
    words.forEach(w => {
      line.push(w); probe.text(line.join(' '));
      if (probe.node().getComputedTextLength() > width && line.length > 1) {
        line.pop(); lines.push(line.join(' ')); line = [w];
      }
    });
    lines.push(line.join(' ')); probe.remove();
    const lh = 1.1, y0 = -((lines.length - 1) * lh) / 2;
    lines.forEach((l, i) => t.append('tspan').attr('x', t.attr('x')).attr('dy', (i === 0 ? y0 + 0.35 : lh) + 'em').text(l));
  });
}

function tipHtml(d) {
  const nome = d.tipo === 'azienda' ? `${d.nome} (${d.regione})` : d.nome;
  const val = d.min == null ? CONFIG.gratuito : `<b>${nDec(d.min)} €</b>`;
  return `<b>${nome}</b><br>Tariffa minima: ${val}`;
}
function showTip(event, d) {
  gRows.selectAll('g.row').classed('on', o => o === d);
  tip.html(tipHtml(d)).style('opacity', 1);
  const [mx, my] = d3.pointer(event, chartEl);
  const tw = tip.node().offsetWidth, th = tip.node().offsetHeight, cw = chartEl.clientWidth;
  let x = mx + 12, y = my - th - 8;
  if (x + tw > cw) x = Math.max(0, mx - tw - 12);
  if (y < 0) y = my + 14;
  tip.style('left', x + 'px').style('top', y + 'px');
}
function hideTip() { tip.style('opacity', 0); gRows.selectAll('g.row').classed('on', false); }

let lastHeight = 0;
function sendHeight() {
  const h = Math.ceil(wrapEl.getBoundingClientRect().height);
  if (h !== lastHeight && window.parent !== window) {
    lastHeight = h;
    window.parent.postMessage({altezza: h, height: h, id: EMBED_ID}, '*');
  }
}

function draw() {
  const data = rows();
  const n = data.length;
  const W = chartEl.clientWidth;
  const narrow = W < 450;
  const m = {top: 22, right: 16, bottom: 4};
  chartEl.style.minHeight = (n * (narrow ? 20 : 16) + m.top + m.bottom) + 'px';
  const H = chartEl.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);

  const fs = narrow ? 11 : 12;
  const probe = svg.append('text').attr('class', 'label').style('font-size', fs + 'px');
  const longest = d3.max(data, d => probe.text(d.nome).node().getComputedTextLength());
  probe.remove();
  m.left = Math.ceil(Math.min(longest + 16, W * 0.45));

  const innerH = Math.min(H - m.top - m.bottom, n * 34);
  const x = d3.scaleLinear().domain([0, d3.max(data, d => d.max ?? 0)]).nice().range([m.left, W - m.right]);
  const y = d3.scaleBand().domain(data.map(d => d.nome)).range([m.top, m.top + innerH]).padding(0.2);
  const cy = d => y(d.nome) + y.bandwidth() / 2;
  const r = Math.max(3.5, Math.min(6, y.bandwidth() * 0.32));

  gGrid.attr('transform', `translate(0,${m.top - 6})`)
    .call(d3.axisTop(x).ticks(narrow ? 4 : 7).tickFormat(nTick).tickSize(-(innerH + 6)).tickPadding(4));
  gGrid.selectAll('.tick line').attr('stroke', '#e3e3e3');

  // una riga sì e una no con lo sfondo grigio chiaro, da bordo a bordo
  gBg.selectAll('rect').data(data.filter((d, i) => i % 2 === 0), d => d.nome).join('rect').attr('class', 'stripe')
    .attr('x', 0).attr('width', W).attr('y', d => y(d.nome) - y.step() * y.paddingInner() / 2).attr('height', y.step());

  gRows.selectAll('g.row').data(data, d => d.nome).join(enter => {
    const g = enter.append('g').attr('class', 'row');
    g.append('line').attr('class', 'range');
    g.append('g').attr('class', 'vals');
    g.append('circle').attr('class', 'dotmax');
    g.append('circle').attr('class', 'dot');
    g.append('text').attr('class', 'free');
    g.append('rect').attr('class', 'hit');
    return g;
  }).each(function (d) {
    const g = d3.select(this);
    const has = d.min != null, isRange = has && d.max > d.min;  // linea ogni volta che i valori sono diversi
    g.select('.range').style('display', isRange ? null : 'none')
      .attr('x1', has ? x(d.min) : 0).attr('x2', isRange ? x(d.max) : 0).attr('y1', cy(d)).attr('y2', cy(d));
    // un pallino per ogni tariffa, con un piccolo spostamento verticale per far vedere dove si addensano
    const jit = Math.max(0, y.bandwidth() / 2 - 2.6);
    const interni = d.valori.length > 2 ? d.valori.slice(1, -1) : [];  // minimo e massimo hanno il pallino pieno
    g.select('.dotmax').style('display', has && d.max > d.min ? null : 'none')
      .attr('cx', has ? x(d.max) : 0).attr('cy', cy(d)).attr('r', r);
    g.select('.vals').selectAll('circle').data(interni).join('circle').attr('class', 'val')
      .attr('cx', v => x(v)).attr('r', 2.6)
      .attr('cy', (v, i) => cy(d) + (interni.length > 1 ? (((i * 0.6180339887) % 1) * 2 - 1) * jit : 0));
    g.select('.dot').style('display', has ? null : 'none').attr('cx', has ? x(d.min) : 0).attr('cy', cy(d)).attr('r', r);
    g.select('.free').style('display', has ? 'none' : null).attr('x', x(0) + 4).attr('y', cy(d) + 4)
      .style('font-size', (fs - 0.5) + 'px').text(CONFIG.gratuito);
    g.select('.hit').attr('x', 0).attr('width', W).attr('y', y(d.nome) - y.step() * y.paddingInner() / 2).attr('height', y.step())
      .on('pointerenter pointermove', e => showTip(e, d)).on('pointerleave', hideTip);
  });

  gLabels.style('font-size', fs + 'px').selectAll('text').data(data, d => d.nome).join('text')
    .attr('class', 'label').attr('x', m.left - 8).attr('text-anchor', 'end').attr('y', null)
    .text(d => d.nome).call(wrapLabel, m.left - 14)
    .attr('transform', d => `translate(0,${cy(d)})`);

  sendHeight();
}

sel.on('change', () => { hideTip(); draw(); });
document.addEventListener('pointerdown', e => { if (!e.target.classList.contains('hit')) hideTip(); });
let lastW = 0, lastH = 0;
new ResizeObserver(() => {
  const w = chartEl.clientWidth, h = chartEl.clientHeight;
  if (w !== lastW || h !== lastH) { lastW = w; lastH = h; draw(); }
}).observe(chartEl);
new ResizeObserver(sendHeight).observe(wrapEl);
document.fonts && document.fonts.ready.then(draw);
draw();
</script>
